<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel Web de Control de Servicios Systemd" />
    <title>Panel de Servicios Systemd</title>
    <script>
      // Tema oscuro aplicado ANTES de pintar para evitar el "flash" blanco.
      // Se guarda la preferencia en localStorage; si no hay ninguna, se usa la
      // del sistema operativo (prefers-color-scheme).
      (function () {
        try {
          var stored = localStorage.getItem('panel_theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bloqueado: se ignora y queda el tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
