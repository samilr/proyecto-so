# =============================================================================
#  nginx.conf — Servidor de la SPA + proxy inverso hacia el backend
#
#  Este archivo cumple DOS funciones a la vez:
#    1) Servir los archivos estaticos que genero Vite (dist/).
#    2) Reenviar todo lo que empiece por /api/ al contenedor del backend.
#
#  Gracias a (2), el navegador ve UN SOLO ORIGEN (http://<host>): la SPA y la
#  API comparten dominio y puerto, asi que NO hay peticiones cross-origin y el
#  problema de CORS desaparece por completo en produccion.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version exacta de Nginx en las cabeceras (superficie de
    # ataque: facilita buscar exploits conocidos de esa version).
    server_tokens off;

    # ---- Compresion -------------------------------------------------------
    # Reduce el tamano transferido del bundle JS/CSS. No se comprimen imagenes
    # ni fuentes porque ya vienen comprimidas y solo se gastaria CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # =========================================================================
    #  PROXY INVERSO HACIA EL BACKEND
    #
    #  "backend" NO es un nombre DNS de internet: es el NOMBRE DEL SERVICIO en
    #  docker-compose.yml. Compose crea una red bridge propia para el proyecto
    #  y levanta un servidor DNS interno (en 127.0.0.11) que resuelve cada
    #  nombre de servicio a la IP que el daemon le asigno al contenedor.
    #  Por eso este contenedor puede escribir "http://backend:8000" sin
    #  conocer ninguna IP: es descubrimiento de servicios por DNS.
    #
    #  Ademas, el puerto 8000 NO necesitaria publicarse al host para que esto
    #  funcione: dentro de la red bridge los contenedores se ven entre si.
    # =========================================================================
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        # Host: el backend ve el dominio que escribio el usuario, no "backend".
        proxy_set_header Host              $host;
        # X-Real-IP / X-Forwarded-For: sin estas cabeceras, Express veria como
        # IP de origen la del contenedor de Nginx y el rate limit del login
        # (5 intentos por IP) trataria a TODOS los usuarios como uno solo.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un start/stop/restart puede tardar unos segundos (el backend corta a
        # los 10 s). Se da margen para que Nginx no aborte antes que el backend.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Las respuestas de la API son estado en vivo: nunca deben cachearse.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ---- Assets con hash en el nombre -------------------------------------
    # Vite genera nombres como index-a1b2c3d4.js. Al cambiar el contenido
    # cambia el hash y por tanto la URL, asi que se pueden cachear "para
    # siempre" sin riesgo de servir una version vieja (immutable).
    location /assets/ {
        # Se usa SOLO add_header y no la directiva `expires`: `expires` emite
        # su propio Cache-Control y la respuesta acabaria con la cabecera
        # duplicada (una sin `immutable`), lo que confunde a algunos proxys.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback ------------------------------------------------------
    # react-router maneja las rutas EN EL NAVEGADOR: /logs no existe como
    # archivo en el disco. Sin este try_files, recargar con F5 estando en
    # /logs devolveria un 404 de Nginx. Con el, se sirve index.html y React
    # resuelve la ruta del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html NO se cachea: es el que apunta a los assets con hash
        # nuevos tras cada despliegue.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Health del propio Nginx (util para el healthcheck de Compose).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
